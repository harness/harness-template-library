pipeline:
  name: Create Repository and Pipeline
  identifier: ci_sto_hcr_standard
  orgIdentifier: ${ORGANIZATION_ID}
  projectIdentifier: ${PROJECT_ID}
  description: |-
    Creates a new Harness Code Repository and CI pipeline with SAST and SCA scans

    Note: This Factory requires both the SAST/SCA and CI Module Primers to be deployed
  tags: {
    pipeline_type: ci
  }
  stages:
    - stage:
        name: Create_Manage_Workspace
        identifier: Create_Manage_Workspace
        description: ""
        type: Pipeline
        spec:
          org: ${WORKSPACE_MGMT_ORG_ID}
          project: ${WORKSPACE_MGMT_PROJECT_ID}
          pipeline: ${WORKSPACE_MGMT_PIPELINE_ID}
          inputs:
            identifier: ${WORKSPACE_MGMT_PIPELINE_ID}
            variables:
              - name: RESOURCE_NAME
                type: String
                value: CISTOHCR_<+pipeline.variables.organization_id>_<+pipeline.variables.project_id>_<+<+pipeline.variables.repository_name>.replace(" ","-").replace("-", "_")>
              - name: RESOURCE_OWNER
                type: String
                value: user:account/<+pipeline.triggeredBy.email>
              - name: RESOURCE_VARS
                type: String
                value: |-
                  {
                    "harness_platform_account":"<+account.identifier>",
                    "organization_id":"<+pipeline.variables.organization_id>",
                    "project_id":"<+pipeline.variables.project_id>",
                    "repository_name":"<+pipeline.variables.repository_name>",
                    "repository_description":"<+pipeline.variables.repository_description>",
                    "repository_rule_is_active":"<+pipeline.variables.repository_rule_is_active>",
                    "repository_merge_strategies":"[\"<+pipeline.variables.repository_merge_strategies.replace(',','\",\"')>\"]"
                  }
              - name: RESOURCE_VARS_SECRETS
                type: String
                value: "{}"
              - name: RESOURCE_VARS_ENVS
                type: String
                value: "{}"
              - name: RESOURCE_VARS_ENVS_SECRET
                type: String
                value: "{}"
              - name: GIT_REPOSITORY_BRANCH
                type: String
                value: main
              - name: GIT_REPOSITORY_CONNECTOR
                type: String
                value: <+variable.account.custom_template_library_connector>
              - name: GIT_REPOSITORY_NAME
                type: String
                value: <+variable.account.custom_template_library_repo>
              - name: GIT_REPOSITORY_PATH
                type: String
                value: ci-sto-hcr-standard
              - name: IAC_PROVISIONER_TYPE
                type: String
                value: opentofu
              - name: IAC_PROVISIONER_VERSION
                type: String
                value: 1.10.0
              - name: IAC_PROVIDER_CONNECTOR
                type: String
                value: ""
              - name: INCLUDE_HARNESS_ENVS
                type: String
                value: "true"
              - name: REGISTER_IDP
                type: String
                value: "${SHOULD_USE_HARNESS_IDP}"
              # Determines if the workflow will trigger a temporary workspace that is
              # deleted upon completion. Resources will be preserved
              # Must be "true" or "false" and wrapped in quotes
              - name: IS_EPHEMERAL
                type: String
                value: "true"
              # Determines if the workflow will require an Approval before executing
              # Must be "true" or "false" and wrapped in quotes
              - name: REQUIRES_APPROVAL
                type: String
                value: "false"
              - name: WORKSPACE_ORG
                type: String
                value: Harness_Platform_Management
              - name: WORKSPACE_PROJECT
                type: String
                value: Solutions_Factory
              - name: WORKSPACE_TAGS
                type: String
                # Used to group by type the workspaces for bulk actions
                value: |-
                  {
                    "source":"custom",
                    "type":"ci-sto-hcr-standard"
                  }
  variables:
    ## Harness Hierarchy Setup Details
    - name: organization_id
      type: String
      description: "[Required] Provide an existing organization reference ID.  Must exist before execution"
      required: true
      value: <+input>.regex(^([a-zA-Z][_a-zA-Z0-9]*)$)
    - name: project_id
      type: String
      description: "[Required] Provide an existing project reference ID.  Must exist before execution"
      required: true
      value: <+input>.regex(^([a-zA-Z][_a-zA-Z0-9]*)$)
    - name: repository_name
      type: String
      description: What is the name of the repository? A new pipeline will be created based on this name. Name must start with a letter or _ and only contain [a-zA-Z0-9-_.]
      required: true
      value: <+input>.regex(^[a-zA-Z][_a-zA-Z0-9 ]{1,127}$)
    - name: repository_description
      type: String
      description: Provide the Description for the Repository
      required: false
      value: <+input>.default()
    - name: repository_rule_is_active
      type: String
      description: When 'active' will enforce repository rules preventing changes except by CODEOWNERS
      required: true
      value: <+input>.default(active).selectOneFrom(active,disabled,monitor)
    - name: repository_merge_strategies
      type: String
      description: Limit which merge strategies are available to merge a pull request
      required: true
      value: <+input>.default().selectManyFrom(fast-forward,merge,rebase,squash)
