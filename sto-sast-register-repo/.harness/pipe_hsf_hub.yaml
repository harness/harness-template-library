pipeline:
  name: Register Repository for Scans
  identifier: registerrepositorysecurity
  orgIdentifier: ${ORGANIZATION_ID}
  projectIdentifier: ${PROJECT_ID}
  description: |-
    Deploys new pipeline for chosen repository for SCA and SAST scans
  tags: {
    pipeline_type: sto
  }
  stages:
    - stage:
        name: Create_Manage_Workspace
        identifier: Create_Manage_Workspace
        description: ""
        type: Pipeline
        spec:
          org: ${WORKSPACE_MGMT_ORG_ID}
          project: ${WORKSPACE_MGMT_PROJECT_ID}
          pipeline: ${WORKSPACE_MGMT_PIPELINE_ID}
          inputs:
            identifier: ${WORKSPACE_MGMT_PIPELINE_ID}
            variables:
              - name: RESOURCE_NAME
                type: String
                value: <+<+pipeline.variables.organization_id>.toLowerCase()>_<+<+pipeline.variables.project_id>.toLowerCase()>_<+<+pipeline.variables.repository_name>.replace(" ","-").replace("-","_")>
              - name: RESOURCE_OWNER
                type: String
                value: user:account/<+pipeline.triggeredBy.email>
              - name: RESOURCE_VARS
                type: String
                value: |-
                  {
                    "organization_id":"<+pipeline.variables.organization_id>",
                    "project_id":"<+pipeline.variables.project_id>",
                    "repository_name":"<+pipeline.variables.repository_name>",
                    "repository_path":"<+pipeline.variables.repository_path>",
                    "repository_connector_ref":"<+pipeline.variables.repository_connector_ref>",
                    "branches":"<+pipeline.variables.branches>",
                    "webhook_type":"<+pipeline.variables.webhook_type>"
                  }
              - name: RESOURCE_VARS_SECRETS
                type: String
                value: "{}"
              - name: RESOURCE_VARS_ENVS
                type: String
                value: "{}"
              - name: RESOURCE_VARS_ENVS_SECRET
                type: String
                value: "{}"
              - name: GIT_REPOSITORY_BRANCH
                type: String
                value: main
              - name: GIT_REPOSITORY_CONNECTOR
                type: String
                value: <+variable.account.custom_template_library_connector>
              - name: GIT_REPOSITORY_NAME
                type: String
                value: <+variable.account.custom_template_library_repo>
              - name: GIT_REPOSITORY_PATH
                type: String
                value: sto-sast-primer/modules/register-repo
              - name: IAC_PROVISIONER_TYPE
                type: String
                value: opentofu
              - name: IAC_PROVISIONER_VERSION
                type: String
                value: 1.10.0
              - name: IAC_PROVIDER_CONNECTOR
                type: String
                value: ""
              - name: INCLUDE_HARNESS_ENVS
                type: String
                value: "true"
              - name: REGISTER_IDP
                type: String
                value: "${SHOULD_USE_HARNESS_IDP}"
              # Determines if the workflow will trigger a temporary workspace that is
              # deleted upon completion. Resources will be preserved
              # Must be "true" or "false" and wrapped in quotes
              - name: IS_EPHEMERAL
                type: String
                value: "true"
              # Determines if the workflow will require an Approval before executing
              # Must be "true" or "false" and wrapped in quotes
              - name: REQUIRES_APPROVAL
                type: String
                value: "false"
              - name: WORKSPACE_ORG
                type: String
                value: Harness_Platform_Management
              - name: WORKSPACE_PROJECT
                type: String
                value: Solutions_Factory
              - name: WORKSPACE_TAGS
                type: String
                # Used to group by type the workspaces for bulk actions
                value: |-
                  {
                    "source":"custom",
                    "type":"sto-sast-primer/modules/register-repo"
                  }
  variables:
    ## Harness Hierarchy Setup Details
    - name: organization_id
      type: String
      description: "[Required] Provide an existing organization reference ID.  Must exist before execution"
      required: true
      value: <+input>.regex(^([a-zA-Z][_a-zA-Z0-9]*)$)
    - name: project_id
      type: String
      description: "[Required] Provide an existing project reference ID.  Must exist before execution"
      required: true
      value: <+input>.regex(^([a-zA-Z][_a-zA-Z0-9]*)$)
    - name: repository_name
      type: String
      description: "[Required] Provide the repository name. This value will be used to configure the pipeline"
      required: true
      value: <+input>
    - name: repository_path
      type: String
      description: "[Required] Provide the repository path. This value will be used to configure the source code for pipeline"
      required: true
      value: <+input>
    - name: repository_connector_ref
      type: String
      description: "[Optional] Provide the repository connector. When 'null', the pipeline will be configured to use Harness Code Repository for the pipeline source code"
      required: false
      value: <+input>.regex(^account.([a-zA-Z][_a-zA-Z0-9]*)$|org.([a-zA-Z][_a-zA-Z0-9]*)$|([a-zA-Z][_a-zA-Z0-9]*)$)
    - name: branches
      type: String
      description: "[Optional] When configured for 'all' or a specific branches, new pipeline triggers will be added to execute the pipeline when updates are made to branches"
      required: true
      value: <+input>.default().selectOneFrom(all,main_only,skipped)
    - name: webhook_type
      type: String
      description: "[Required] Provide a supported webhook type"
      required: true
      value: <+input>.default().selectOneFrom(harness,github,bitbucket)
