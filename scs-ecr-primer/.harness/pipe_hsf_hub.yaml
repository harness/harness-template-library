pipeline:
  name: Deploy SCS ECR Supply Chain Security Templates
  identifier: scs_ecr_supply_chain_security
  orgIdentifier: ${ORGANIZATION_ID}
  projectIdentifier: ${PROJECT_ID}
  description: |-
    Deploys the SCS ECR CI/CD StepGroup templates used to generate, sign, and verify
    SBOM/SLSA provenance attestations for container artifacts stored in AWS ECR.

    Note: Requires the Harness Software Supply Chain Assurance (SSCA) module to be enabled.
  tags: {
    pipeline_type: hsf_primer
  }
  stages:
    - stage:
        name: Create_Manage_Workspace
        identifier: Create_Manage_Workspace
        description: ""
        type: Pipeline
        spec:
          org: ${WORKSPACE_MGMT_ORG_ID}
          project: ${WORKSPACE_MGMT_PROJECT_ID}
          pipeline: ${WORKSPACE_MGMT_PIPELINE_ID}
          inputs:
            identifier: ${WORKSPACE_MGMT_PIPELINE_ID}
            variables:
              - name: RESOURCE_NAME
                type: String
                value: SCS_ECR_SUPPLY_CHAIN_SECURITY
              - name: RESOURCE_OWNER
                type: String
                value: user:account/<+pipeline.triggeredBy.email>
              - name: RESOURCE_VARS
                type: String
                value: |-
                  {
                      "harness_platform_account":"<+account.identifier>",
                      "organization_id":"<+pipeline.variables.organization_id>",
                      "project_id":"<+pipeline.variables.project_id>"
                  }
              - name: RESOURCE_VARS_SECRETS
                type: String
                value: "{}"
              - name: RESOURCE_VARS_ENVS
                type: String
                value: "{}"
              - name: RESOURCE_VARS_ENVS_SECRET
                type: String
                value: "{}"
              - name: GIT_REPOSITORY_BRANCH
                type: String
                value: main
              - name: GIT_REPOSITORY_CONNECTOR
                type: String
                value: <+variable.account.custom_template_library_connector>
              - name: GIT_REPOSITORY_NAME
                type: String
                value: <+variable.account.custom_template_library_repo>
              - name: GIT_REPOSITORY_PATH
                type: String
                value: scs-ecr-primer
              - name: IAC_PROVISIONER_TYPE
                type: String
                value: opentofu
              - name: IAC_PROVISIONER_VERSION
                type: String
                value: 1.10.0
              - name: IAC_PROVIDER_CONNECTOR
                type: String
                value: ""
              - name: INCLUDE_HARNESS_ENVS
                type: String
                value: "true"
              - name: REGISTER_IDP
                type: String
                value: "${SHOULD_USE_HARNESS_IDP}"
              # Determines if the workflow will trigger a temporary workspace that is
              # deleted upon completion. Resources will be preserved
              # Must be "true" or "false" and wrapped in quotes
              - name: IS_EPHEMERAL
                type: String
                value: "false"
              # Determines if the workflow will require an Approval before executing
              # Must be "true" or "false" and wrapped in quotes
              - name: REQUIRES_APPROVAL
                type: String
                value: "false"
              - name: WORKSPACE_ORG
                type: String
                value: Harness_Platform_Management
              - name: WORKSPACE_PROJECT
                type: String
                value: Solutions_Factory
              - name: WORKSPACE_TAGS
                type: String
                # Used to group by type the workspaces for bulk actions
                value: |-
                  {
                    "source":"custom",
                    "type":"scs-ecr-primer"
                  }
  variables:
    ## Harness Hierarchy Setup Details
    - name: organization_id
      type: String
      description: "[Optional] Existing Organization ID to scope the templates to. Leave blank for Account-level templates."
      required: false
      value: <+input>
    - name: project_id
      type: String
      description: "[Optional] Existing Project ID to scope the templates to. Requires organization_id."
      required: false
      value: <+input>
